name: V4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MYAI_EMBEDDING_PROVIDER: deterministic
  MYAI_KNOWLEDGE_DB_PATH: /tmp/my-ai-knowledge.sqlite3

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: pytest

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

  smoke:
    name: Smoke / package import
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Import and semantic retrieval smoke test
        run: python - <<'PY'
          from myai import AIEngine, ChatRequest, Document
          ai = AIEngine()
          added = ai.add_document(Document(source="ci.txt", text="Paris is the capital of France."))
          assert added == 1
          result = ai.generate(ChatRequest(message="What is the capital of France?"))
          assert result.version == "v4"
          assert result.text
          print(result.model)
          PY

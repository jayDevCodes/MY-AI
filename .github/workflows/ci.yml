name: MY-AI CI

on:
  push:
    branches: [main, v6-cognitive-core, v7-recursive-agent-graph, fix/v10-ci-current-engine, v10-self-healing-runtime]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MYAI_EMBEDDING_PROVIDER: deterministic
  MYAI_KNOWLEDGE_DB_PATH: /tmp/my-ai-knowledge.sqlite3
  MYAI_AGENT_MODE: auto
  MYAI_CODE_INDEX_ENABLED: true
  MYAI_SELF_HEALING_ENABLED: true

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Run tests
        run: pytest

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

  smoke:
    name: Smoke / V10 current package and architecture
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Import and architecture smoke test
        run: python - <<'PY'
          from myai import (
              AIEngine,
              AdaptiveModelRouter,
              ChatRequest,
              CodeIntelligenceIndex,
              Document,
              ExecutionBudget,
              JudgeVerdict,
              RecursiveAgentGraph,
              RoutingRequest,
              TaskNode,
              WorkArtifact,
              run_architecture_benchmark,
          )

          ai = AIEngine()
          assert ai.version == "v10.0"
          added = ai.add_document(Document(source="ci.txt", text="Paris is the capital of France."))
          assert added == 1
          result = ai.generate(ChatRequest(message="What is the capital of France?"))
          assert result.version == "v10.0"
          assert result.text

          decision = AdaptiveModelRouter().choose(
              RoutingRequest(task_kind="research", complexity=0.9, uncertainty=0.9)
          )
          assert decision.tier == "frontier"
          assert decision.allow_parallel is True
          assert CodeIntelligenceIndex() is not None

          def decompose(node, budget):
              return (TaskNode("child", "verify fact", "research", 1, node.id),) if node.depth == 0 else ()

          def worker(node, children):
              return WorkArtifact(node.id, node.role, "ok", 0.9)

          def judge(node, artifact, children):
              return JudgeVerdict(True, 0.9)

          graph = RecursiveAgentGraph(ExecutionBudget(max_depth=2, max_nodes=4))
          graph_result = graph.run(TaskNode("root", "smoke"), decompose=decompose, worker=worker, judge=judge)
          assert graph_result.confidence == 0.9

          benchmark = run_architecture_benchmark(repository_root=".")
          assert benchmark.results
          for score, evidence in benchmark.results.values():
              assert score >= 0.8 or evidence[0] == "unmeasured-by-runner"

          print(result.model)
          print(f"architecture_benchmark_ms={benchmark.elapsed_ms:.2f}")
          PY
